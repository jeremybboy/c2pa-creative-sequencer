<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Audio Soft-Binding Recovery Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">LOCAL / OFFLINE POC</p>
      <h1>Audio Soft-Binding Recovery Demo</h1>
      <p>C2PA SBR-inspired local demonstration service</p>
    </header>
    <button id="import">Import Sequencer Publications</button>
    <label id="drop" for="file">
      <strong>Drop an audio file here</strong>
      <span>or choose an audio file</span>
      <input id="file" type="file" accept="audio/*,.wav">
    </label>
    <section id="steps" hidden>
      <article><b>STEP 1</b><h2>Embedded Content Credentials</h2><p id="embedded">Checking…</p></article>
      <article><b>STEP 2</b><h2>Audio watermark</h2><p id="watermark">Searching…</p></article>
      <article><b>STEP 3</b><h2>Binding match</h2><p id="binding">Waiting…</p></article>
      <article><b>STEP 4</b><h2>Recovered Content Credentials</h2><div id="result">Waiting…</div></article>
    </section>
    <p id="status">Ready.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
