<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <rect width="1600" height="960" fill="#151c22"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#eef2f5">
    <text x="40" y="70" font-size="42" font-weight="700">PR 023</text>
    <text x="245" y="58" font-size="34" font-weight="700">Bounce MIDI track to credentialed stem</text>
    <text x="245" y="95" font-size="20" fill="#bac7cf">Real instrument audio → signed WAV → normal media ingredient</text>
    <text x="40" y="143" font-size="17" fill="#f1c77e">LOCAL IMPLEMENTATION · Automated evidence in brief · External-instrument / listening acceptance still required</text>

    <rect x="40" y="184" width="360" height="385" fill="#26323d"/>
    <rect x="425" y="184" width="360" height="385" fill="#26323d"/>
    <rect x="810" y="184" width="360" height="385" fill="#26323d"/>
    <rect x="1195" y="184" width="365" height="385" fill="#26323d"/>
    <g font-size="24" font-weight="700">
      <text x="60" y="224" fill="#b9a0e8">1. Select MIDI + VST3</text>
      <text x="445" y="224" fill="#77ccdd">2. Render and sign</text>
      <text x="830" y="224" fill="#94d3ae">3. Import + mute</text>
      <text x="1215" y="224" fill="#efc984">4. Export real ingredient</text>
    </g>
    <g font-size="18" fill="#d5dee4">
      <text x="60" y="263">Notes + active instrument + signer.</text>
      <text x="60" y="291">Right-click header → Bounce.</text>
      <text x="445" y="263">Only this instrument; no master DSP.</text>
      <text x="445" y="291">Stage a WAV, then validate signing.</text>
      <text x="830" y="263">New audio track at MIDI start.</text>
      <text x="830" y="291">Keep editable MIDI; mute its source.</text>
      <text x="1215" y="263">The signed WAV is the ingredient.</text>
      <text x="1215" y="291">No fabricated MIDI ingredient.</text>
    </g>

    <rect x="60" y="322" width="320" height="88" fill="#5f477b"/>
    <text x="74" y="348" font-size="17">MIDI track · instrument slot</text>
    <g fill="#d9bee9">
      <rect x="86" y="378" width="48" height="10"/>
      <rect x="145" y="367" width="65" height="10"/>
      <rect x="224" y="354" width="39" height="10"/>
      <rect x="277" y="373" width="69" height="10"/>
    </g>
    <rect x="60" y="430" width="320" height="43" fill="#17232c" stroke="#b9a0e8"/>
    <text x="77" y="458" font-size="17">Capture live instrument state</text>
    <text x="60" y="508" font-size="17">Hash MIDI content + binary state.</text>
    <text x="60" y="536" font-size="17" fill="#b9a0e8">Never put raw plugin state in C2PA.</text>

    <rect x="445" y="322" width="320" height="70" fill="#163642"/>
    <polyline points="459,358 468,358 474,340 481,373 490,350 498,363 508,342 516,373 525,358 537,358 544,342 552,368 561,350 570,364 580,353 590,359 612,359 622,339 630,371 640,350 651,364 663,345 675,366 686,358 750,358" fill="none" stroke="#9bdded" stroke-width="3"/>
    <text x="445" y="423" font-size="19" font-weight="700">c2pa.created · digitalCreation</text>
    <text x="445" y="452" font-size="19" font-weight="700">c2pa.rendered · real metadata</text>
    <text x="445" y="493" font-size="17">Embedded manifest + asset integrity.</text>
    <text x="445" y="522" font-size="17" fill="#efc984">Test signer ≠ external trust.</text>
    <text x="445" y="546" font-size="17">Temporary files cleaned after the job.</text>

    <rect x="830" y="322" width="320" height="66" fill="#4c4853"/>
    <text x="846" y="348" font-size="17">Original MIDI · MUTED</text>
    <g fill="#817a89"><rect x="855" y="363" width="62" height="9"/><rect x="937" y="355" width="85" height="9"/><rect x="1040" y="366" width="75" height="9"/></g>
    <rect x="830" y="406" width="320" height="68" fill="#386458"/>
