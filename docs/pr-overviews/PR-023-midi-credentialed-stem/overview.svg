    <polyline points="845,454 855,454 862,439 870,468 878,447 886,457 897,445 907,464 918,454 940,454 950,444 960,465 969,450 980,458 995,449 1010,454 1030,454 1040,439 1050,468 1062,445 1074,462 1088,454 1133,454" fill="none" stroke="#b7e5cc" stroke-width="3"/>
    <text x="830" y="508" font-size="17">Mixer transfers; not printed twice.</text>
    <text x="830" y="536" font-size="17">One undo item · save / reopen.</text>

    <rect x="1215" y="322" width="325" height="55" fill="#493f2b"/>
    <text x="1230" y="356" font-size="18">Final signed musical export</text>
    <path d="M1375 377 V400 M1260 400 H1500 M1260 400 V419 M1380 400 V419 M1500 400 V419" fill="none" stroke="#d9b976" stroke-width="2"/>
    <rect x="1215" y="419" width="97" height="58" fill="#386458"/>
    <rect x="1327" y="419" width="98" height="58" fill="#3a4857"/>
    <rect x="1440" y="419" width="100" height="58" fill="#45494e"/>
