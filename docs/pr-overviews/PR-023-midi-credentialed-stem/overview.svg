      <text x="1263" y="443">Signed stem</text><text x="1263" y="465">CC history</text>
      <text x="1376" y="443">Other media</text><text x="1376" y="465">if audible</text>
      <text x="1490" y="443">Plain sample</text><text x="1490" y="465">no CC</text>
    </g>
    <text x="1215" y="508" font-size="17">Existing export pipeline is unchanged.</text>
    <text x="1215" y="536" font-size="17">Signed ingredient history is retained.</text>

    <rect x="40" y="602" width="1520" height="83" fill="#202a33"/>
    <text x="60" y="632" font-size="18" font-weight="700">TRUTHFUL METADATA</text>
    <text x="60" y="663" font-size="18" fill="#c9d5dd">Track · BPM · clips / notes · MIDI SHA-256 · instrument name / vendor / version / format / ID · instrument-state SHA-256</text>

    <g font-size="17" fill="#d5dee4">
      <rect x="40" y="718" width="360" height="160" fill="#26323d"/>
      <rect x="425" y="718" width="360" height="160" fill="#26323d"/>
      <rect x="810" y="718" width="360" height="160" fill="#26323d"/>
      <rect x="1195" y="718" width="365" height="160" fill="#26323d"/>
      <g font-size="20" font-weight="700" fill="#eef2f5">
        <text x="60" y="753">CURRENT STARTING POINT</text>
        <text x="445" y="753">CHANGES IN THIS PR</text>
        <text x="830" y="753">UNCHANGED / OUT OF SCOPE</text>
        <text x="1215" y="753">END RESULT TO ACCEPT</text>
      </g>
      <text x="60" y="793">PR 022 stem-signing foundation.</text>
      <text x="60" y="824">MIDI already plays in final mixes.</text>
      <text x="60" y="855">No separately signed MIDI asset.</text>
      <text x="445" y="793">Isolated render + real metadata.</text>
      <text x="445" y="824">Signed media import + atomic mute.</text>
      <text x="445" y="855">Credentials show actions / instrument.</text>
      <text x="830" y="793">No audio recording or MIDI import.</text>
      <text x="830" y="824">No recovery / threshold changes.</text>
      <text x="830" y="855">No automatic tail or tempo stretch.</text>
      <text x="1215" y="793">Audible timing / level preserved.</text>
      <text x="1215" y="824">Real credentialed stem ingredient.</text>
      <text x="1215" y="855">Human instrument test before merge.</text>
    </g>
    <text x="40" y="921" font-size="17" fill="#9facb5">Playback pauses for offline bounce · Position retained · MIDI remains editable · Recording deferred · Do not merge automatically</text>
  </g>
