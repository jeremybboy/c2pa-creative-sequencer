    <g font-size="21" text-anchor="middle"><text x="605" y="385">Instrument output</text><text x="605" y="424" fill="#77ccdd">↓</text><text x="605" y="463">WAV → sign → validate</text><text x="605" y="504" fill="#94d3ae">created + rendered</text></g>
    <rect x="830" y="362" width="320" height="72" fill="#36574b"/><text x="848" y="405" font-size="21">Signed stem audio → mixer</text><rect x="830" y="450" width="320" height="80" fill="#1a242c"/><text x="848" y="480" font-size="18">Original MIDI: temporarily silent</text><text x="848" y="511" font-size="18">No second instrument execution</text>
