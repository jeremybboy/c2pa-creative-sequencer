    <g font-size="24" font-weight="700"><text x="60" y="260" fill="#b9a0e8">1. Export normally</text><text x="445" y="260" fill="#77ccdd">2. Render + sign MIDI</text><text x="830" y="260" fill="#94d3ae">3. Mix real signed audio</text><text x="1215" y="260" fill="#efc984">4. Restore + inspect</text></g>
