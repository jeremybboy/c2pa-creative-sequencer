    <text x="40" y="190" font-size="18" fill="#efc984">Release + 18/18 tests passed · Synthetic input + real signing · Live hardware / listening NOT verified</text>
    <g fill="#26323d"><rect x="40" y="220" width="360" height="370"/><rect x="425" y="220" width="360" height="370"/><rect x="810" y="220" width="360" height="370"/><rect x="1195" y="220" width="365" height="370"/></g>
    <g font-size="24" font-weight="700"><text x="60" y="262" fill="#ef8d93">1. Choose + arm</text><text x="445" y="262" fill="#77ccdd">2. Record raw input</text><text x="830" y="262" fill="#94d3ae">3. Stop + credential</text><text x="1215" y="262" fill="#b9a0e8">4. Import + export</text></g>
    <g font-size="18" fill="#d5dee4">
      <text x="60" y="300">Audio track only · mono channel.</text><text x="60" y="329">Second arm replaces the first.</text>
      <text x="445" y="300">Global Record starts/continues Play.</text><text x="445" y="329">Bounded queue → disk thread.</text>
      <text x="830" y="300">Finalize WAV before any claim.</text><text x="830" y="329">created / digitalCapture.</text>
      <text x="1215" y="300">Verified copy into project Media.</text><text x="1215" y="329">Clip at original start position.</text>
    </g>
    <rect x="60" y="360" width="320" height="83" fill="#1a242c"/>
    <text x="76" y="392" font-size="21">Audio 1</text><rect x="189" y="371" width="92" height="55" fill="#82302f"/><circle cx="235" cy="399" r="13" fill="#ef7279"/>
    <rect x="299" y="374" width="12" height="50" fill="#24352e"/><rect x="299" y="388" width="12" height="36" fill="#78cb9b"/>
    <text x="60" y="480" font-size="21">Input → live raw-input meter</text><text x="60" y="518" font-size="18" fill="#efc984">No monitoring to speakers</text>
