    <g font-size="21" font-weight="700"><text x="60" y="740">BEFORE THIS PR: PR 024</text><text x="445" y="740">CHANGES IN THIS PR</text><text x="830" y="740">UNCHANGED / OUT OF SCOPE</text><text x="1215" y="740">AFTER HUMAN ACCEPTANCE</text></g>
    <g font-size="18" fill="#d5dee4">
      <text x="60" y="778">Automatic MIDI export provenance</text><text x="60" y="811">Explicit MIDI bounce available</text><text x="60" y="844">Capture signing template exists</text><text x="60" y="877">No external recording workflow</text>
