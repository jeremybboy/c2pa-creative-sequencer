    <g font-size="17" fill="#bac7cf"><text x="60" y="568">Arm/meter never create credentials.</text><text x="445" y="568">No file IO or signing in callback.</text><text x="830" y="568">OS input label ≠ verified identity.</text><text x="1215" y="568">One undoable import · Save/reopen.</text></g>
