    <circle cx="475" cy="399" r="13" fill="#ef7279"/><text x="501" y="406" font-size="22" fill="#ef8d93">RECORDING</text>
    <text x="445" y="480" font-size="21">Temporary mono 24-bit WAV</text><text x="445" y="518" font-size="18" fill="#efc984">Edits locked · Cancel discards</text>
